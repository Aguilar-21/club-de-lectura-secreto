<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="El Club de Lectura Secreto: registra los libros que estás leyendo y deja reseñas anónimas con valoración de 1 a 5 estrellas."
    />
    <meta name="theme-color" content="#0b1210" />
    <title>El Club de Lectura Secreto</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Inter:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="ambiente" aria-hidden="true">
      <span class="ambiente-brillo ambiente-brillo--uno"></span>
      <span class="ambiente-brillo ambiente-brillo--dos"></span>
      <span class="ambiente-grano"></span>
    </div>

    <div id="app">
      <div class="cargando" role="status">
        <span class="cargando-sello">★</span>
        <p>Abriendo el estante secreto…</p>
      </div>
    </div>

    <div id="modal-root"></div>
    <div id="confirm-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
